<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="598" viewBox="0 0 1200 598" role="img" aria-labelledby="t">
<title id="t">Installer TELIOS en six étapes</title>
<g font-family="'Segoe UI', Ubuntu, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
<g transform="translate(0.0 0)">
  <rect x=".5" y=".5" width="385.7" height="349" rx="10" fill="#FFFFFF" stroke="#DDE3EE"/>
  <text x="362.7" y="62" text-anchor="end" font-size="46" font-weight="800" fill="#C7692F" fill-opacity=".3">1</text>
  <rect x="24" y="24" width="40" height="40" rx="6" fill="#9A4E22"/><path transform="translate(34.0 34.0) scale(0.833)" d="M4 5h16v11H4zM9 20h6M12 16v4" fill="none" stroke="#FFFFFF" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="104" font-size="19" font-weight="800" fill="#111A2B">Préparer le poste</text>
  <circle cx="28" cy="127" r="2.6" fill="#C7692F"/><text x="40" y="132" font-size="15" fill="#4A5771"><tspan>Un</tspan><tspan> PC</tspan><tspan> sous</tspan><tspan font-weight="700" fill="#111A2B"> Linux</tspan><tspan font-weight="700" fill="#111A2B"> Mint</tspan><tspan font-weight="700" fill="#111A2B"> 21+</tspan><tspan font-weight="700" fill="#111A2B"> ou</tspan><tspan font-weight="700" fill="#111A2B"> Ubuntu</tspan><tspan font-weight="700" fill="#111A2B"> 22.04+</tspan><tspan>.</tspan></text><circle cx="28" cy="153" r="2.6" fill="#C7692F"/><text x="40" y="158" font-size="15" fill="#4A5771"><tspan>Une</tspan><tspan> connexion</tspan><tspan> Internet.</tspan></text><circle cx="28" cy="179" r="2.6" fill="#C7692F"/><text x="40" y="184" font-size="15" fill="#4A5771"><tspan>Un</tspan><tspan> compte</tspan><tspan> utilisateur</tspan><tspan> normal,</tspan><tspan font-weight="700" fill="#111A2B"> jamais</tspan><tspan font-weight="700" fill="#111A2B"> root</tspan><tspan>.</tspan></text><circle cx="28" cy="205" r="2.6" fill="#C7692F"/><text x="40" y="210" font-size="15" fill="#4A5771"><tspan>La</tspan><tspan font-weight="700" fill="#111A2B"> clé</tspan><tspan font-weight="700" fill="#111A2B"> de</tspan><tspan font-weight="700" fill="#111A2B"> licence</tspan><tspan> de</tspan><tspan> votre</tspan><tspan> entreprise</tspan></text><text x="40" y="232" font-size="15" fill="#4A5771"><tspan>(TLK-XXXXX-XXXXX-XXXXX-XXXXX-XXXXX),</tspan></text><text x="40" y="254" font-size="15" fill="#4A5771"><tspan>visible</tspan><tspan> dans</tspan><tspan> l'espace</tspan><tspan> client,</tspan><tspan> page</tspan><tspan> Postes.</tspan></text>
</g>
<g transform="translate(406.7 0)">
  <rect x=".5" y=".5" width="385.7" height="349" rx="10" fill="#FFFFFF" stroke="#DDE3EE"/>
  <text x="362.7" y="62" text-anchor="end" font-size="46" font-weight="800" fill="#C7692F" fill-opacity=".3">2</text>
  <rect x="24" y="24" width="40" height="40" rx="6" fill="#9A4E22"/><path transform="translate(34.0 34.0) scale(0.833)" d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 11l5 5 5-5M12 4v12" fill="none" stroke="#FFFFFF" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="104" font-size="19" font-weight="800" fill="#111A2B">Lancer l'installation</text>
  <text x="24" y="132" font-size="15" fill="#4A5771"><tspan>Ouvrez</tspan><tspan> un</tspan><tspan> terminal</tspan><tspan> (menu</tspan><tspan> →</tspan><tspan> Terminal,</tspan><tspan> ou</tspan></text><text x="24" y="154" font-size="15" fill="#4A5771"><tspan>Ctrl+Alt+T),</tspan><tspan> puis</tspan><tspan> collez</tspan><tspan> cette</tspan><tspan> ligne,</tspan><tspan font-weight="700" fill="#111A2B"> sans</tspan></text><text x="24" y="176" font-size="15" fill="#4A5771"><tspan font-weight="700" fill="#111A2B">sudo</tspan><tspan> :</tspan></text><rect x="24" y="192" width="339" height="82" rx="8" fill="#0B1220"/><text x="36" y="214" font-family="'SFMono-Regular', 'Ubuntu Mono', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#E8EEF9">wget -O install.sh https://raw.githubuser</text><text x="36" y="234" font-family="'SFMono-Regular', 'Ubuntu Mono', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#E8EEF9">content.com/NBILITY-HOME/TELIOS_RELEASES/</text><text x="36" y="254" font-family="'SFMono-Regular', 'Ubuntu Mono', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#E8EEF9">main/install.sh &amp;&amp; bash install.sh</text>
</g>
<g transform="translate(813.3 0)">
  <rect x=".5" y=".5" width="385.7" height="349" rx="10" fill="#FFFFFF" stroke="#DDE3EE"/>
  <text x="362.7" y="62" text-anchor="end" font-size="46" font-weight="800" fill="#C7692F" fill-opacity=".3">3</text>
  <rect x="24" y="24" width="40" height="40" rx="6" fill="#9A4E22"/><path transform="translate(34.0 34.0) scale(0.833)" d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" fill="none" stroke="#FFFFFF" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="104" font-size="19" font-weight="800" fill="#111A2B">Laisser faire l'installateur</text>
  <circle cx="28" cy="127" r="2.6" fill="#C7692F"/><text x="40" y="132" font-size="15" fill="#4A5771"><tspan>Il</tspan><tspan> vérifie</tspan><tspan> le</tspan><tspan> socle</tspan><tspan> (Python</tspan><tspan> 3.8+,</tspan><tspan> PyGObject,</tspan></text><text x="40" y="154" font-size="15" fill="#4A5771"><tspan>GTK</tspan><tspan> 4)</tspan><tspan> et</tspan><tspan> propose</tspan><tspan> de</tspan><tspan> l'installer</tspan><tspan> s'il</tspan></text><text x="40" y="176" font-size="15" fill="#4A5771"><tspan>manque ;</tspan><tspan> le</tspan><tspan> mot</tspan><tspan> de</tspan><tspan> passe</tspan><tspan> est</tspan><tspan> demandé</tspan><tspan> une</tspan></text><text x="40" y="198" font-size="15" fill="#4A5771"><tspan>seule</tspan><tspan> fois.</tspan></text><circle cx="28" cy="219" r="2.6" fill="#C7692F"/><text x="40" y="224" font-size="15" fill="#4A5771"><tspan>Il</tspan><tspan> télécharge</tspan><tspan> la</tspan><tspan> dernière</tspan><tspan> version</tspan><tspan> publiée</tspan><tspan> et</tspan></text><text x="40" y="246" font-size="15" fill="#4A5771"><tspan>vérifie</tspan><tspan> la</tspan><tspan> signature</tspan><tspan> TELIOS.</tspan></text><circle cx="28" cy="267" r="2.6" fill="#C7692F"/><text x="40" y="272" font-size="15" fill="#4A5771"><tspan>Il</tspan><tspan> pose</tspan><tspan> l'icône</tspan><tspan> dans</tspan><tspan> le</tspan><tspan> menu</tspan><tspan> (rubrique</tspan></text><text x="40" y="294" font-size="15" fill="#4A5771"><tspan>Accessoires).</tspan></text><path transform="translate(24.0 307.0) scale(0.667)" d="M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="#0F7B4F" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="320" font-size="15" font-weight="700" fill="#0F7B4F">Aucune clé n'est demandée à l'installation.</text>
</g>
<g transform="translate(0.0 370)">
  <rect x=".5" y=".5" width="385.7" height="227" rx="10" fill="#FFFFFF" stroke="#DDE3EE"/>
  <text x="362.7" y="62" text-anchor="end" font-size="46" font-weight="800" fill="#C7692F" fill-opacity=".3">4</text>
  <rect x="24" y="24" width="40" height="40" rx="6" fill="#9A4E22"/><path transform="translate(34.0 34.0) scale(0.833)" d="M14 10a4 4 0 1 0-1.2 2.8L21 21M17 17l2-2" fill="none" stroke="#FFFFFF" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="104" font-size="19" font-weight="800" fill="#111A2B">Activer le poste</text>
  <text x="24" y="132" font-size="15" fill="#4A5771"><tspan>Ouvrez</tspan><tspan> TELIOS</tspan><tspan> depuis</tspan><tspan> le</tspan><tspan> menu,</tspan><tspan> allez</tspan><tspan> dans</tspan></text><text x="24" y="154" font-size="15" fill="#4A5771"><tspan>Réglages</tspan><tspan> →</tspan><tspan> Licence,</tspan><tspan> collez</tspan><tspan> la</tspan><tspan> clé</tspan><tspan> de</tspan><tspan> licence</tspan></text><text x="24" y="176" font-size="15" fill="#4A5771"><tspan>(ou</tspan><tspan> scannez</tspan><tspan> son</tspan><tspan> QR</tspan><tspan> code),</tspan><tspan> puis</tspan><tspan> cliquez</tspan></text><text x="24" y="198" font-size="15" fill="#4A5771"><tspan>« Activer</tspan><tspan> ce</tspan><tspan> poste ».</tspan></text>
</g>
<g transform="translate(406.7 370)">
  <rect x=".5" y=".5" width="385.7" height="227" rx="10" fill="#FFFFFF" stroke="#DDE3EE"/>
  <text x="362.7" y="62" text-anchor="end" font-size="46" font-weight="800" fill="#C7692F" fill-opacity=".3">5</text>
  <rect x="24" y="24" width="40" height="40" rx="6" fill="#9A4E22"/><path transform="translate(34.0 34.0) scale(0.833)" d="M4 7l8-4 8 4-8 4zM4 12l8 4 8-4M4 17l8 4 8-4" fill="none" stroke="#FFFFFF" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="104" font-size="19" font-weight="800" fill="#111A2B">Compléter les outils</text>
  <text x="24" y="132" font-size="15" fill="#4A5771"><tspan>Les</tspan><tspan> autres</tspan><tspan> outils</tspan><tspan> (ADB,</tspan><tspan> rapports</tspan><tspan> PDF,</tspan><tspan> lecture</tspan></text><text x="24" y="154" font-size="15" fill="#4A5771"><tspan>de</tspan><tspan> QR</tspan><tspan> code,</tspan><tspan> etc.)</tspan><tspan> s'installent</tspan><tspan> depuis</tspan><tspan> TELIOS,</tspan></text><text x="24" y="176" font-size="15" fill="#4A5771"><tspan>dans</tspan><tspan> Réglages</tspan><tspan> →</tspan><tspan> Dépendances :</tspan><tspan> les</tspan><tspan> manquants</tspan><tspan> y</tspan></text><text x="24" y="198" font-size="15" fill="#4A5771"><tspan>sont</tspan><tspan> pré-cochés.</tspan></text>
</g>
<g transform="translate(813.3 370)">
  <rect x=".5" y=".5" width="385.7" height="227" rx="10" fill="#FFFFFF" stroke="#DDE3EE"/>
  <text x="362.7" y="62" text-anchor="end" font-size="46" font-weight="800" fill="#C7692F" fill-opacity=".3">6</text>
  <rect x="24" y="24" width="40" height="40" rx="6" fill="#9A4E22"/><path transform="translate(34.0 34.0) scale(0.833)" d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="#FFFFFF" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="104" font-size="19" font-weight="800" fill="#111A2B">Rester à jour</text>
  <text x="24" y="132" font-size="15" fill="#4A5771"><tspan>Les</tspan><tspan> mises</tspan><tspan> à</tspan><tspan> jour</tspan><tspan> sont</tspan><tspan> proposées</tspan><tspan> au</tspan><tspan> lancement</tspan><tspan> de</tspan></text><text x="24" y="154" font-size="15" fill="#4A5771"><tspan>TELIOS,</tspan><tspan> et</tspan><tspan> s'installent</tspan><tspan> depuis</tspan><tspan> Réglages</tspan><tspan> →</tspan></text><text x="24" y="176" font-size="15" fill="#4A5771"><tspan>Mises</tspan><tspan> à</tspan><tspan> jour.</tspan></text>
</g>
</g>
</svg>
