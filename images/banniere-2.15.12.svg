    <stop offset="0" stop-color="#C7692F" stop-opacity=".55"/><stop offset="1" stop-color="#C7692F" stop-opacity="0"/></radialGradient>
  <radialGradient id="halo2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1240 400) scale(620 420)">
    <stop offset="0" stop-color="#4F8CFF" stop-opacity=".22"/><stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/></radialGradient>
  <pattern id="grille" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E8EEF9" stroke-opacity=".05"/></pattern>
  <linearGradient id="carte" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16233D"/><stop offset="1" stop-color="#0F1A2E"/></linearGradient>
