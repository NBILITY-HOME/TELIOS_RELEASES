<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">TELIOS 2.15.12 — Une ligne, et le poste est prêt.</title>
<desc id="d">Dernière version publiée : TELIOS 2.15.12, publiée le 09/10/2026. Signature TELIOS vérifiée. Compatible Linux Mint 21+ et Ubuntu 22.04+.</desc>
