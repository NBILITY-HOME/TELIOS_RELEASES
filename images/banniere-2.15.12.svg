  <text x="90" y="72" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E08A4F">DISTRIBUTION PUBLIQUE · SANS CLÉ GITHUB</text>
  <text x="62" y="140" font-size="46" font-weight="800" fill="#FFFFFF">Une ligne, et le poste est prêt.</text>
  <text x="64" y="192" font-size="18" fill="#B9C4DA">L'installateur pose le socle, télécharge la dernière version et vérifie la signature TELIOS.</text>
  <text x="64" y="220" font-size="18" fill="#B9C4DA">La clé de licence s'ajoute ensuite, dans TELIOS.</text>
  <g transform="translate(64 268)"><rect width="170" height="36" rx="18" fill="#C7692F" fill-opacity=".16" stroke="#E08A4F"/><path transform="translate(14.0 9.0) scale(0.750)" d="M4 5h16v11H4zM9 20h6M12 16v4" fill="none" stroke="#E08A4F" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="24" font-size="15" font-weight="700" fill="#F2F5FB">Linux Mint 21+</text></g><g transform="translate(246 268)"><rect width="161" height="36" rx="18" fill="#C7692F" fill-opacity=".16" stroke="#E08A4F"/><path transform="translate(14.0 9.0) scale(0.750)" d="M4 5h16v11H4zM9 20h6M12 16v4" fill="none" stroke="#E08A4F" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="24" font-size="15" font-weight="700" fill="#F2F5FB">Ubuntu 22.04+</text></g>
  <path transform="translate(64.0 328.0) scale(0.833)" d="M5 12l5 5L20 7" fill="none" stroke="#3FB97F" stroke-width="2.88" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="344" font-size="18" font-weight="700" fill="#FFFFFF">TELIOS est compatible Linux Mint et Ubuntu.</text>
